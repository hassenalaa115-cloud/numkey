name: Build NumKeyboard APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Create project files
        run: |
          set -e
          mkdir -p "$(dirname "app/build.gradle.kts")"
          cat > "app/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.numkeyboard"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.numkeyboard"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF
          mkdir -p "$(dirname "app/src/main/AndroidManifest.xml")"
          cat > "app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="كيبورد الأرقام"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".NumKeyboard"
                      android:exported="true"
                      android:label="كيبورد الأرقام"
                      android:permission="android.permission.BIND_INPUT_METHOD">
                      <intent-filter>
                          <action android:name="android.view.InputMethod" />
                      </intent-filter>
                      <meta-data
                          android:name="android.view.im"
                          android:resource="@xml/method" />
                  </service>
              </application>
          </manifest>
          EOF
          mkdir -p "$(dirname "app/src/main/java/com/example/numkeyboard/MainActivity.kt")"
          cat > "app/src/main/java/com/example/numkeyboard/MainActivity.kt" <<'EOF'
          package com.example.numkeyboard

          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.inputmethod.InputMethodManager
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import android.text.InputType

          class MainActivity : Activity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val prefs = getSharedPreferences("kb", MODE_PRIVATE)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 96, 48, 48)
                  }

                  val title = TextView(this).apply {
                      text = "إعدادات كيبورد الأرقام"
                      textSize = 22f
                      gravity = Gravity.CENTER
                  }

                  val hint = TextView(this).apply {
                      text = "كم خانة تريد قبل الإرسال التلقائي؟ (من 1 إلى 5)\n" +
                          "1 = آحاد، 2 = + عشرات، 3 = + مئات، 4 = + آلاف، 5 = + عشرات الآلاف"
                      setPadding(0, 32, 0, 16)
                  }

                  val input = EditText(this).apply {
                      inputType = InputType.TYPE_CLASS_NUMBER
                      setText(prefs.getInt("limit", 4).toString())
                  }

                  val save = Button(this).apply {
                      text = "حفظ"
                      setOnClickListener {
                          val n = input.text.toString().toIntOrNull()
                          if (n == null || n !in 1..5) {
                              Toast.makeText(context, "اكتب رقم من 1 إلى 5", Toast.LENGTH_SHORT).show()
                          } else {
                              prefs.edit().putInt("limit", n).apply()
                              Toast.makeText(context, "تم الحفظ: $n خانات", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }

                  val enable = Button(this).apply {
                      text = "1) تفعيل الكيبورد"
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_INPUT_METHOD_SETTINGS))
                      }
                  }

                  val choose = Button(this).apply {
                      text = "2) اختيار الكيبورد"
                      setOnClickListener {
                          (getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager)
                              .showInputMethodPicker()
                      }
                  }

                  root.addView(title)
                  root.addView(hint)
                  root.addView(input)
                  root.addView(save)
                  root.addView(enable)
                  root.addView(choose)
                  setContentView(root)
              }
          }
          EOF
          mkdir -p "$(dirname "app/src/main/java/com/example/numkeyboard/NumKeyboard.kt")"
          cat > "app/src/main/java/com/example/numkeyboard/NumKeyboard.kt" <<'EOF'
          package com.example.numkeyboard

          import android.inputmethodservice.InputMethodService
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.View
          import android.view.inputmethod.EditorInfo
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class NumKeyboard : InputMethodService() {

              // من الأصغر للأكبر
              private val labels = listOf("آحاد", "عشرات", "مئات", "آلاف", "عشرات الآلاف")

              private var limit = 4
              private val typed = StringBuilder()
              private var slotsRow: LinearLayout? = null
              private val slotDigits = ArrayList<TextView>() // الفهرس = المرتبة (0 = آحاد)

              override fun onCreateInputView(): View {
                  val v = layoutInflater.inflate(R.layout.num_keyboard, null)
                  slotsRow = v.findViewById(R.id.slots)

                  val ids = listOf(
                      R.id.b0, R.id.b1, R.id.b2, R.id.b3, R.id.b4,
                      R.id.b5, R.id.b6, R.id.b7, R.id.b8, R.id.b9
                  )
                  ids.forEachIndexed { digit, id ->
                      v.findViewById<Button>(id).setOnClickListener { onDigit(digit.toString()) }
                  }
                  v.findViewById<Button>(R.id.del).setOnClickListener { onDelete() }

                  loadLimit()
                  buildSlots()
                  return v
              }

              override fun onStartInputView(info: EditorInfo?, restarting: Boolean) {
                  super.onStartInputView(info, restarting)
                  typed.clear()
                  loadLimit()
                  buildSlots()
              }

              private fun loadLimit() {
                  limit = getSharedPreferences("kb", MODE_PRIVATE)
                      .getInt("limit", 4).coerceIn(1, 5)
              }

              private fun buildSlots() {
                  val row = slotsRow ?: return
                  row.removeAllViews()
                  slotDigits.clear()

                  // نبني الخانات من الأكبر (يسار) إلى الأصغر (يمين)
                  val views = arrayOfNulls<TextView>(limit)
                  for (place in limit - 1 downTo 0) {
                      val col = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          gravity = Gravity.CENTER
                          layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                      }
                      val digit = TextView(this).apply {
                          text = "_"
                          textSize = 28f
                          gravity = Gravity.CENTER
                      }
                      val label = TextView(this).apply {
                          text = labels[place]
                          textSize = 11f
                          gravity = Gravity.CENTER
                      }
                      col.addView(digit)
                      col.addView(label)
                      row.addView(col)
                      views[place] = digit
                  }
                  for (i in 0 until limit) slotDigits.add(views[i]!!)
                  refresh()
              }

              private fun refresh() {
                  // أول رقم تكتبه يروح لأكبر مرتبة
                  for (place in 0 until limit) {
                      val index = limit - 1 - place
                      slotDigits[place].text =
                          if (index < typed.length) typed[index].toString() else "_"
                  }
              }

              private fun onDigit(d: String) {
                  val ic = currentInputConnection ?: return
                  if (typed.length >= limit) return
                  ic.commitText(d, 1)
                  typed.append(d)
                  refresh()
                  if (typed.length == limit) {
                      send()
                      typed.clear()
                      refresh()
                  }
              }

              private fun onDelete() {
                  if (typed.isEmpty()) return
                  currentInputConnection?.deleteSurroundingText(1, 0)
                  typed.deleteCharAt(typed.length - 1)
                  refresh()
              }

              private fun send() {
                  val ic = currentInputConnection ?: return
                  if (!ic.performEditorAction(EditorInfo.IME_ACTION_SEND)) {
                      ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_ENTER))
                      ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_ENTER))
                  }
              }
          }
          EOF
          mkdir -p "$(dirname "app/src/main/res/layout/num_keyboard.xml")"
          cat > "app/src/main/res/layout/num_keyboard.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:layoutDirection="ltr"
              android:orientation="vertical"
              android:padding="8dp">

              <!-- صف الخانات: عشرات الآلاف | آلاف | مئات | عشرات | آحاد -->
              <LinearLayout
                  android:id="@+id/slots"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginBottom="8dp"
                  android:orientation="horizontal" />

              <GridLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:columnCount="3">

                  <Button android:id="@+id/b1" android:text="1" style="@style/KeyBtn" />
                  <Button android:id="@+id/b2" android:text="2" style="@style/KeyBtn" />
                  <Button android:id="@+id/b3" android:text="3" style="@style/KeyBtn" />

                  <Button android:id="@+id/b4" android:text="4" style="@style/KeyBtn" />
                  <Button android:id="@+id/b5" android:text="5" style="@style/KeyBtn" />
                  <Button android:id="@+id/b6" android:text="6" style="@style/KeyBtn" />

                  <Button android:id="@+id/b7" android:text="7" style="@style/KeyBtn" />
                  <Button android:id="@+id/b8" android:text="8" style="@style/KeyBtn" />
                  <Button android:id="@+id/b9" android:text="9" style="@style/KeyBtn" />

                  <Button android:id="@+id/del" android:text="⌫" style="@style/KeyBtn" />
                  <Button android:id="@+id/b0" android:text="0" style="@style/KeyBtn" />
                  <Space android:layout_width="0dp" android:layout_height="0dp"
                      android:layout_columnWeight="1" />
              </GridLayout>
          </LinearLayout>
          EOF
          mkdir -p "$(dirname "app/src/main/res/values/keyboard_styles.xml")"
          cat > "app/src/main/res/values/keyboard_styles.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="KeyBtn">
                  <item name="android:layout_width">0dp</item>
                  <item name="android:layout_height">60dp</item>
                  <item name="android:layout_columnWeight">1</item>
                  <item name="android:layout_margin">3dp</item>
                  <item name="android:textSize">22sp</item>
              </style>
          </resources>
          EOF
          mkdir -p "$(dirname "app/src/main/res/xml/method.xml")"
          cat > "app/src/main/res/xml/method.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android"
              android:settingsActivity="com.example.numkeyboard.MainActivity">
              <subtype
                  android:label="Numbers"
                  android:imeSubtypeLocale="en_US"
                  android:imeSubtypeMode="keyboard" />
          </input-method>
          EOF
          mkdir -p "$(dirname "build.gradle.kts")"
          cat > "build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          mkdir -p "$(dirname "gradle.properties")"
          cat > "gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF
          mkdir -p "$(dirname "settings.gradle.kts")"
          cat > "settings.gradle.kts" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NumKeyboard"
          include(":app")
          EOF
      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: NumKeyboard ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
